<!--
/**
 * Scene: Dev Preview Dashboard
 * Description: Development utility page — NOT used in OBS. Lists all scenes as
 *              scaled iframe previews (25%), shows current state.js values,
 *              and provides buttons to trigger hits/modify state for testing.
 * OBS Setup:   N/A — open in browser during development only.
 * URL Params:  None
 */
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NGC — Dev Dashboard</title>
  <script src="/config.js"></script>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    /* Override base 1920px body size for dashboard */
    html, body {
      width: 100%;
      min-height: 100vh;
      height: auto;
      overflow: auto;
      background: #0a0a0f;
      font-family: var(--font-ui);
      font-size: 14px;
    }

    /* ── Layout ──────────────────────────────────────────────────── */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      padding: 24px;
      min-height: 100vh;
      max-width: 1800px;
      margin: 0 auto;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    .dash-header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--color-red);
    }
    .dash-title {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-white);
    }
    .dash-title span { color: var(--color-red); }
    .dash-subtitle {
      font-size: 12px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* ── Scene Grid ──────────────────────────────────────────────── */
    .scenes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .scene-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
    }
    .scene-card:hover {
      border-color: rgba(200,16,46,0.4);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    /* iframe preview — aspect ratio + scale set dynamically per scene */
    .scene-preview {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #0a0a0f;
      cursor: pointer;
    }
    .scene-preview iframe {
      position: absolute;
      top: 0;
      left: 0;
      border: none;
      transform-origin: top left;
      pointer-events: none;
    }
    .scene-preview-overlay {
      position: absolute;
      inset: 0;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0);
      transition: background var(--dur-fast) ease;
    }
    .scene-preview-overlay:hover {
      background: rgba(0,0,0,0.3);
    }
    .scene-preview-overlay:hover .preview-open-btn { opacity: 1; }
    .preview-open-btn {
      background: var(--color-red);
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity var(--dur-fast) ease;
    }

    .scene-info {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .scene-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-white);
    }
    .scene-path {
      font-size: 11px;
      color: var(--color-text-muted);
      font-family: monospace;
    }
    .scene-open-link {
      color: var(--color-gold);
      font-size: 12px;
      text-decoration: none;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .scene-open-link:hover { text-decoration: underline; }

    /* ── Right Sidebar ───────────────────────────────────────────── */
    .sidebar-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 24px;
      height: fit-content;
    }

    .panel {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }
    .panel-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--color-text-muted);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-border);
    }

    /* State viewer */
    .state-field {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 12px;
    }
    .state-key {
      color: var(--color-text-muted);
      font-family: monospace;
      flex-shrink: 0;
    }
    .state-value {
      color: var(--color-white);
      font-weight: 600;
      text-align: right;
      font-family: monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }

    /* Controls */
    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ctrl-label {
      font-size: 11px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .ctrl-row {
      display: flex;
      gap: 6px;
    }
    .ctrl-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--color-white);
      font-family: var(--font-ui);
      font-size: 12px;
      outline: none;
    }
    .ctrl-input:focus { border-color: var(--color-gold); }

    .btn {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 7px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
      white-space: nowrap;
    }
    .btn:hover   { transform: scale(1.03); }
    .btn:active  { transform: scale(0.97); }
    .btn-red     { background: var(--color-red);  color: #fff; }
    .btn-gold    { background: var(--color-gold); color: #000; }
    .btn-muted   { background: var(--color-surface-2); color: var(--color-text-muted); border: 1px solid var(--color-border); }
    .btn-full    { width: 100%; }
    .btn:focus-visible { outline: 2px solid var(--color-gold); outline-offset: 2px; }

    /* Team claimed count badge */
    .claimed-badge {
      display: inline-block;
      background: rgba(200,16,46,0.15);
      border: 1px solid rgba(200,16,46,0.3);
      border-radius: 99px;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--color-red);
      font-family: var(--font-display);
      font-weight: 700;
    }

    /* Hit log */
    .hit-log {
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--color-red) transparent;
    }
    .hit-log-item {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 11px;
    }
    .hit-log-player  { color: var(--color-white); font-weight: 600; }
    .hit-log-details { color: var(--color-text-muted); }
    .hit-log-empty   { color: var(--color-text-muted); font-size: 11px; text-align: center; padding: 12px 0; opacity: 0.5; }
  </style>
</head>
<body>

<div class="dashboard">

  <!-- Header -->
  <header class="dash-header">
    <div>
      <div id="dashTitle" class="dash-title">NEW GEN <span>Collections</span> — Dev Dashboard</div>
      <div class="dash-subtitle">Overlay preview &amp; state controller — not for OBS</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-muted" id="refreshAllBtn">Refresh Previews</button>
      <button class="btn btn-red"   id="resetStateBtn">Reset Break State</button>
    </div>
  </header>

  <!-- Scene grid -->
  <main class="scenes-grid" id="scenesGrid"></main>

  <!-- Right sidebar -->
  <aside class="sidebar-panel">

    <!-- State viewer -->
    <div class="panel">
      <div class="panel-title">Current State <span class="claimed-badge" id="claimedBadge">0 claimed</span></div>
      <div id="stateView"></div>
    </div>

    <!-- Fire hit alert -->
    <div class="panel">
      <div class="panel-title">Fire Hit Alert</div>
      <div class="ctrl-group">
        <div class="ctrl-label">Player name</div>
        <input class="ctrl-input" id="hitPlayer" value="Patrick Mahomes" placeholder="Player name">
        <div class="ctrl-label">Card</div>
        <input class="ctrl-input" id="hitCard" value="Auto Prizm /10" placeholder="Card description">
        <div class="ctrl-label">Team ID (e.g. kc, hou)</div>
        <input class="ctrl-input" id="hitTeam" value="kc" placeholder="Team slug">
        <div class="ctrl-label">Estimated value ($)</div>
        <input class="ctrl-input" id="hitValue" value="450" placeholder="Value">
        <button class="btn btn-gold btn-full" id="fireHitBtn">🔥 Fire Hit Alert</button>
      </div>
    </div>

    <!-- Break settings -->
    <div class="panel">
      <div class="panel-title">Break Settings</div>
      <div class="ctrl-group">
        <div class="ctrl-label">Product name</div>
        <input class="ctrl-input" id="settingProduct" placeholder="Product name">
        <div class="ctrl-label">Break type</div>
        <input class="ctrl-input" id="settingType" placeholder="Pick Your Team | Random | Case Break">
        <div class="ctrl-label">Break number</div>
        <input class="ctrl-input" id="settingBreakNum" type="number" min="1" placeholder="Break #">
        <div class="ctrl-label">Total boxes</div>
        <div class="ctrl-row">
          <input class="ctrl-input" id="settingTotalBoxes" type="number" min="1" max="12" placeholder="Boxes">
          <input class="ctrl-input" id="settingTotalPacks" type="number" min="1" placeholder="Packs/box">
        </div>
        <button class="btn btn-red btn-full" id="applySettingsBtn">Apply Settings</button>
      </div>
    </div>

    <!-- Pack navigation -->
    <div class="panel">
      <div class="panel-title">Pack Navigation</div>
      <div class="ctrl-row">
        <button class="btn btn-muted btn-full" id="prevPackBtn">◀ Prev Pack</button>
        <button class="btn btn-red  btn-full" id="nextPackBtn">Next Pack ▶</button>
      </div>
    </div>

    <!-- Hit log -->
    <div class="panel">
      <div class="panel-title">Hit Log</div>
      <div class="hit-log" id="hitLog">
        <div class="hit-log-empty">No hits yet</div>
      </div>
    </div>

  </aside>
</div>

<script src="js/teams.js"></script>
<script src="js/state.js"></script>
<script>
  /* ── Apply brand config to dashboard header ────────────────────── */
  (function() {
    const cfg = window.OVERLAY_CONFIG;
    if (!cfg) return;
    const el = document.getElementById('dashTitle');
    if (el) {
      const parts = cfg.brandName.split(' ');
      const last  = parts.pop();
      el.innerHTML = parts.join(' ').toUpperCase() + ' <span>' + last + '</span> — Dev Dashboard';
    }
  })();
</script>
<script>
  /* ── Scene definitions ─────────────────────────────────────────── */
  const SCENES = [
    { name: 'Main Break',    path: 'scenes/main-break.html',    desc: '1080×1920',                       nw: 1080, nh: 1920 },
    { name: 'Team Board',    path: 'scenes/team-board.html',    desc: '1920×1080',                       nw: 1920, nh: 1080 },
    { name: 'Randomizer',    path: 'scenes/randomizer.html',    desc: 'Responsive — portrait/landscape', nw: 1080, nh: 1920 },
    { name: 'Starting Soon', path: 'scenes/starting-soon.html', desc: '1080×1920 • ?countdown=15',       nw: 1080, nh: 1920 },
    { name: 'BRB',           path: 'scenes/brb.html',           desc: '1080×1920 • ?countdown=5',        nw: 1080, nh: 1920 },
    { name: 'Hit Alert',     path: 'overlays/hit-alert.html',   desc: 'Overlay • ?trigger=1&player=&card=&team=&value=', nw: 1080, nh: 1920 },
    { name: 'Hits Board',    path: 'overlays/hits-board.html',  desc: 'Widget • 300×330px recommended',  nw: 300,  nh: 330  },
  ];

  /* ── Render scene grid ─────────────────────────────────────────── */
  const grid = document.getElementById('scenesGrid');

  const applyScale = (card, nw, nh) => {
    const preview = card.querySelector('.scene-preview');
    const iframe  = card.querySelector('iframe');
    const w = preview.offsetWidth;
    if (!w) return;
    iframe.style.width     = nw + 'px';
    iframe.style.height    = nh + 'px';
    iframe.style.transform = `scale(${w / nw})`;
  };

  SCENES.forEach(scene => {
    const { nw, nh } = scene;

    const card = document.createElement('div');
    card.className = 'scene-card';
    card.innerHTML = `
      <div class="scene-preview" style="padding-top:${(nh / nw * 100).toFixed(3)}%" title="Click to open full screen">
        <iframe src="${scene.path}" loading="lazy" title="${scene.name} preview" tabindex="-1"></iframe>
        <div class="scene-preview-overlay" role="button" tabindex="0" aria-label="Open ${scene.name} full screen">
          <button class="preview-open-btn" tabindex="-1">Open Full Screen</button>
        </div>
      </div>
      <div class="scene-info">
        <div>
          <div class="scene-name">${scene.name}</div>
          <div class="scene-path">${scene.desc}</div>
        </div>
        <a class="scene-open-link" href="${scene.path}" target="_blank" rel="noopener">Open ↗</a>
      </div>
    `;

    grid.appendChild(card);
    applyScale(card, nw, nh);

    /* Full-screen click — open at native dimensions */
    const overlay  = card.querySelector('.scene-preview-overlay');
    const openScene = () => window.open(scene.path, '_blank', `width=${nw},height=${nh}`);
    overlay.addEventListener('click', openScene);
    overlay.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openScene(); }
    });
  });

  /* Re-scale on window resize */
  window.addEventListener('resize', () => {
    grid.querySelectorAll('.scene-card').forEach((card, i) => {
      if (SCENES[i]) applyScale(card, SCENES[i].nw, SCENES[i].nh);
    });
  });

  /* ── State view ────────────────────────────────────────────────── */
  const STATE_DISPLAY_KEYS = [
    'breakNumber', 'productName', 'breakType',
    'currentBox', 'totalBoxes', 'currentPack', 'totalPacks'
  ];

  const renderStateView = () => {
    const state = NGCState.getState();
    const claimed = (state.teams || []).filter(t => t.claimed).length;

    document.getElementById('claimedBadge').textContent = `${claimed} claimed`;

    const stateView = document.getElementById('stateView');
    stateView.innerHTML = STATE_DISPLAY_KEYS.map(key => `
      <div class="state-field">
        <div class="state-key">${key}</div>
        <div class="state-value">${JSON.stringify(state[key])}</div>
      </div>
    `).join('');

    /* Prefill settings inputs if empty */
    const pEl = document.getElementById('settingProduct');
    if (!pEl.value) pEl.value = state.productName || '';
    const tEl = document.getElementById('settingType');
    if (!tEl.value) tEl.value = state.breakType || '';
    const bEl = document.getElementById('settingBreakNum');
    if (!bEl.value) bEl.value = state.breakNumber || 1;
    const boxEl = document.getElementById('settingTotalBoxes');
    if (!boxEl.value) boxEl.value = state.totalBoxes || 1;
    const pkEl = document.getElementById('settingTotalPacks');
    if (!pkEl.value) pkEl.value = state.totalPacks || 24;

    /* Hit log */
    const hitLog = document.getElementById('hitLog');
    if (!state.recentHits || state.recentHits.length === 0) {
      hitLog.innerHTML = '<div class="hit-log-empty">No hits yet</div>';
    } else {
      hitLog.innerHTML = state.recentHits.map(h => `
        <div class="hit-log-item">
          <div class="hit-log-player">${h.player}</div>
          <div class="hit-log-details">${h.cardName}${h.value ? ` • $${h.value}` : ''}</div>
        </div>
      `).join('');
    }
  };

  /* ── Button handlers ───────────────────────────────────────────── */
  document.getElementById('resetStateBtn').addEventListener('click', () => {
    if (!confirm('Reset all break state? This clears all claimed teams and hits.')) return;
    NGCState.resetBreak();
    renderStateView();
  });

  document.getElementById('refreshAllBtn').addEventListener('click', () => {
    grid.querySelectorAll('iframe').forEach(iframe => {
      iframe.src = iframe.src;
    });
  });

  document.getElementById('fireHitBtn').addEventListener('click', () => {
    const hit = {
      player:   document.getElementById('hitPlayer').value || 'Player',
      cardName: document.getElementById('hitCard').value   || 'Card',
      team:     document.getElementById('hitTeam').value   || '',
      value:    document.getElementById('hitValue').value  || '',
    };
    NGCState.addHit(hit);
    renderStateView();
  });

  document.getElementById('applySettingsBtn').addEventListener('click', () => {
    NGCState.setState({
      productName: document.getElementById('settingProduct').value  || undefined,
      breakType:   document.getElementById('settingType').value     || undefined,
      breakNumber: parseInt(document.getElementById('settingBreakNum').value,  10) || undefined,
      totalBoxes:  parseInt(document.getElementById('settingTotalBoxes').value, 10) || undefined,
      totalPacks:  parseInt(document.getElementById('settingTotalPacks').value, 10) || undefined,
    });
    renderStateView();
  });

  document.getElementById('nextPackBtn').addEventListener('click', () => {
    NGCState.nextPack();
    renderStateView();
  });

  document.getElementById('prevPackBtn').addEventListener('click', () => {
    const state = NGCState.getState();
    if (state.currentPack > 1) {
      NGCState.setState({ currentPack: state.currentPack - 1 });
    } else if (state.currentBox > 1) {
      NGCState.setState({ currentBox: state.currentBox - 1, currentPack: state.totalPacks });
    }
    renderStateView();
  });

  /* ── Live sync ─────────────────────────────────────────────────── */
  renderStateView();
  NGCState.onStateChange(renderStateView);
</script>
</body>
</html>
