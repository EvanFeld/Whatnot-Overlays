<!--
/**
 * Scene: Offline Screen
 * Description: Portrait full-screen offline holding screen for phone/Whatnot streams.
 *              Pulsing OFFLINE badge, next stream schedule, social links.
 * OBS Setup:   1080×1920 Browser Source.
 * URL Params:  ?nextstream=Friday+7PM+CT
 */
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>NGC — Offline</title>
  <link rel="stylesheet" href="../css/theme.css">
  <style>
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--color-dark-bg);
      position: relative;
    }

    #particleLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* Texas outline watermark */
    .texas-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      pointer-events: none;
      z-index: 0;
      animation: breathe 12s ease-in-out infinite;
    }
    .texas-bg svg {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0.06;
      fill: none;
      stroke: #003087;
      stroke-width: 1.5;
      stroke-linejoin: round;
    }

    /* Diagonal stripe background */
    .bg-stripes {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .accent-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      z-index: 2;
    }
    .accent-line.top    { top: 0;    background: linear-gradient(90deg, transparent, var(--color-red) 30%, var(--color-blue) 70%, transparent); }
    .accent-line.bottom { bottom: 0; background: linear-gradient(90deg, transparent, var(--color-blue) 30%, var(--color-red) 70%, transparent); }

    /* ── Content stack — centered column ─────────────────────────── */
    .content {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5vh;
      text-align: center;
      padding: 0 8vw;
      animation: fadeIn 2s ease both;
    }

    /* Logo */
    .logo-wrap img {
      height: 20vh;
      max-width: 70vw;
      object-fit: contain;
      filter: drop-shadow(0 0 3vw rgba(200,16,46,0.3));
      animation: breathe 6s ease-in-out infinite;
    }
    .logo-fallback {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 8vw;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-white);
      animation: breathe 6s ease-in-out infinite;
    }
    .logo-fallback span { color: var(--color-red); }

    /* OFFLINE badge */
    .offline-badge {
      display: flex;
      align-items: center;
      gap: 3vw;
      background: rgba(200,16,46,0.12);
      border: 1px solid rgba(200,16,46,0.3);
      border-radius: var(--radius-full);
      padding: 2vh 8vw;
    }
    .offline-dot {
      width: 16px;
      height: 16px;
      background: var(--color-red);
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulseRed 2s ease-in-out infinite;
    }
    .offline-text {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 5vw;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--color-red);
    }

    /* Slogan */
    .slogan {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 6.5vw;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--color-gold);
      text-shadow: 0 0 20px rgba(255,215,0,0.3);
      animation: breathe 8s 1s ease-in-out infinite;
    }

    /* Divider */
    .divider {
      width: 60vw;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    }

    /* Next stream card */
    .next-stream {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 3vh 10vw;
      text-align: center;
    }
    .next-stream-label {
      font-family: var(--font-ui);
      font-size: 1.8vw;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--color-text-muted);
      margin-bottom: 1vh;
    }
    .next-stream-value {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 4.5vw;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-white);
    }

    /* Social row */
    .social-row {
      display: flex;
      align-items: center;
      gap: 6vw;
    }
    .social-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5vh;
      opacity: 0.6;
    }
    .social-icon {
      width: 7vw;
      height: 7vw;
      fill: var(--color-white);
    }
    .social-handle {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.8vw;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text-muted);
    }
    .social-divider {
      width: 1px;
      height: 7vh;
      background: var(--color-border);
    }

    /* Live clock */
    .live-clock {
      position: absolute;
      bottom: 3vh;
      right: 4vw;
      font-family: var(--font-ui);
      font-size: 2vw;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      z-index: 5;
    }
  </style>
</head>
<body data-scene="offline">

  <div id="particleLayer" aria-hidden="true"></div>
  <div class="bg-stripes texas-stripe-animated" aria-hidden="true"></div>

  <div class="texas-bg" aria-hidden="true">
    <svg viewBox="0 0 500 430" xmlns="http://www.w3.org/2000/svg">
      <path d="M 120,10 L 380,10 L 420,80 L 490,120 L 490,200
               L 450,220 L 460,300 L 400,340 L 380,420 L 280,420
               L 240,380 L 180,390 L 120,350 L 60,360 L 20,300
               L 10,200 L 40,140 L 80,100 Z"/>
    </svg>
  </div>

  <div class="accent-line top"    aria-hidden="true"></div>
  <div class="accent-line bottom" aria-hidden="true"></div>

  <main class="content">

    <div class="logo-wrap">
      <img src="../assets/logo/newgen-logo.svg" alt="New Gen Collections"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div class="logo-fallback" style="display:none">NEW GEN <span>NGC</span></div>
    </div>

    <div class="offline-badge" role="status" aria-label="Stream is offline">
      <div class="offline-dot" aria-hidden="true"></div>
      <div class="offline-text">OFFLINE</div>
    </div>

    <div class="slogan">You miss 100% of the rips you don't take.</div>

    <div class="divider" aria-hidden="true"></div>

    <div class="next-stream" id="nextStreamCard" style="display:none">
      <div class="next-stream-label">Next Stream</div>
      <div class="next-stream-value" id="nextStreamValue">—</div>
    </div>

    <div class="social-row">
      <div class="social-item">
        <svg class="social-icon" viewBox="0 0 24 24" aria-label="Twitch">
          <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
        </svg>
        <div class="social-handle">@NewGenCollections</div>
      </div>
      <div class="social-divider"></div>
      <div class="social-item">
        <svg class="social-icon" viewBox="0 0 24 24" aria-label="Instagram">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
        </svg>
        <div class="social-handle">@NewGenCollections</div>
      </div>
      <div class="social-divider"></div>
      <div class="social-item">
        <svg class="social-icon" viewBox="0 0 24 24" aria-label="YouTube">
          <path d="M23.495 6.205a3.007 3.007 0 0 0-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 0 0 .527 6.205a31.247 31.247 0 0 0-.522 5.805 31.247 31.247 0 0 0 .522 5.783 3.007 3.007 0 0 0 2.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 0 0 2.088-2.088 31.247 31.247 0 0 0 .5-5.783 31.247 31.247 0 0 0-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/>
        </svg>
        <div class="social-handle">NewGenCollections</div>
      </div>
    </div>

  </main>

  <div class="live-clock" id="liveClock"></div>

  <script src="../js/animations.js"></script>
  <script>
    const params     = new URLSearchParams(window.location.search);
    const nextStream = params.get('nextstream');
    if (nextStream) {
      document.getElementById('nextStreamValue').textContent = nextStream;
      document.getElementById('nextStreamCard').style.display = '';
    }

    const clockEl = document.getElementById('liveClock');
    const tick = () => {
      clockEl.textContent = new Date().toLocaleTimeString('en-US', {
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: true, timeZoneName: 'short'
      });
    };
    tick();
    setInterval(tick, 1000);

    NGCAnim.createParticleSystem(document.getElementById('particleLayer'), 15, 'drift');
  </script>
</body>
</html>
