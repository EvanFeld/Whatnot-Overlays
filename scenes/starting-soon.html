<!--
/**
 * Scene: Starting Soon Screen
 * Description: Portrait full-screen pre-stream screen for Whatnot/phone streams.
 *              Letter-by-letter "BE SOMEONE" reveal, countdown timer, social CTAs.
 * OBS Setup:   1080×1920 Browser Source.
 * URL Params:  ?countdown=15 — countdown duration in minutes (default: 15)
 */
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>NGC — Starting Soon</title>
  <script src="/config.js"></script>
  <link rel="stylesheet" href="../css/theme.css">
  <style>
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--color-dark-bg);
      position: relative;
    }

    #particleLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* Frame corners */
    .frame-corner {
      position: absolute;
      width: 4vw;
      height: 4vw;
      border-color: var(--color-red);
      border-style: solid;
      z-index: 2;
      pointer-events: none;
    }
    .frame-corner.tl { top: 2vh;  left: 2vw;  border-width: 3px 0 0 3px; }
    .frame-corner.tr { top: 2vh;  right: 2vw; border-width: 3px 3px 0 0; }
    .frame-corner.bl { bottom: 2vh; left: 2vw;  border-width: 0 0 3px 3px; }
    .frame-corner.br { bottom: 2vh; right: 2vw; border-width: 0 3px 3px 0; }

    /* Accent lines */
    .accent-line {
      position: absolute;
      left: 0; right: 0;
      height: 3px;
      z-index: 2;
      pointer-events: none;
    }
    .accent-line.top    { top: 0;    background: linear-gradient(90deg, transparent, var(--color-red), transparent); }
    .accent-line.bottom { bottom: 0; background: linear-gradient(90deg, transparent, var(--color-red), transparent); }

    /* ── Absolutely positioned elements ──────────────────────────── */
    .logo-wrap {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      animation: slamDownCentered 0.8s var(--ease-out-back) both;
    }
    .logo-wrap img {
      height: 14vh;
      max-width: 30vw;
      min-width: 140px;
      object-fit: contain;
      filter: drop-shadow(0 0 2vw rgba(200,16,46,0.5));
      display: block;
    }
    .logo-fallback {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 5.5vw;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-white);
      line-height: 0.9;
      white-space: nowrap;
    }
    .logo-fallback span { color: var(--color-red); }

    /* slogan tagline */
    .tagline {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 4vw;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-gold);
      text-shadow: var(--glow-gold);
      display: block;
      width: 88%;
      text-align: center;
      line-height: 1.4;
    }
    .tagline-letter {
      display: inline-block;
      opacity: 0;
      transform: translateY(30px) scaleY(0.5);
    }

    /* Status label */
    .status-label {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 2.2vw;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--color-text-muted);
      white-space: nowrap;
      animation: fadeIn 1s 1.5s ease both;
    }

    /* Countdown */
    .countdown-wrap {
      position: absolute;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1vh;
      animation: fadeUpCentered 0.8s 1.8s var(--ease-out-expo) both;
    }
    .countdown-timer {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 20vw;
      letter-spacing: 0.04em;
      color: var(--color-white);
      text-shadow: var(--glow-red);
      line-height: 0.9;
      font-variant-numeric: tabular-nums;
      text-align: center;
      width: 100%;
    }
    .countdown-timer.urgent {
      color: var(--color-red);
      animation: pulseRedText 0.8s ease-in-out infinite;
    }
    @keyframes pulseRedText {
      0%, 100% { text-shadow: 0 0 12px rgba(200,16,46,0.8), 0 0 40px rgba(200,16,46,0.4); }
      50%       { text-shadow: 0 0 24px rgba(200,16,46,1),   0 0 80px rgba(200,16,46,0.9), 0 0 140px rgba(200,16,46,0.4); }
    }

    /* Social CTAs */
    .cta-row {
      position: absolute;
      top: 78%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 7vw;
      animation: fadeUpCentered 0.8s 2.2s var(--ease-out-expo) both;
    }
    .cta-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2vh;
      opacity: 0.8;
    }
    .cta-icon {
      width: 5vw;
      height: 5vw;
      min-width: 36px;
      min-height: 36px;
      fill: var(--color-white);
    }
    .cta-text {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.6vw;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--color-white);
      white-space: nowrap;
    }
    .cta-divider {
      width: 1px;
      height: 6vh;
      background: var(--color-border);
    }

    /* ── Centering-aware entrance animations ─────────────────────── */
    @keyframes slamDownCentered {
      0%   { opacity: 0; transform: translate(-50%, calc(-50% - 80px)) scale(1.2); }
      60%  { opacity: 1; transform: translate(-50%, calc(-50% + 6px))  scale(0.97); }
      80%  {             transform: translate(-50%, calc(-50% - 3px))  scale(1.01); }
      100% {             transform: translate(-50%, -50%)              scale(1); }
    }
    @keyframes fadeUpCentered {
      from { opacity: 0; transform: translate(-50%, calc(-50% + 20px)); }
      to   { opacity: 1; transform: translate(-50%, -50%); }
    }
  </style>
</head>
<body data-scene="starting-soon">

  <div id="particleLayer" aria-hidden="true"></div>

  <div class="frame-corner tl" aria-hidden="true"></div>
  <div class="frame-corner tr" aria-hidden="true"></div>
  <div class="frame-corner bl" aria-hidden="true"></div>
  <div class="frame-corner br" aria-hidden="true"></div>
  <div class="accent-line top"    aria-hidden="true"></div>
  <div class="accent-line bottom" aria-hidden="true"></div>

  <div class="logo-wrap">
    <img id="soonLogo" src="../assets/logo/newgen-logo.svg" alt="New Gen Collections"
         onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <div id="soonLogoFallback" class="logo-fallback" style="display:none">NEW GEN<br><span>COLLECTIONS</span></div>
  </div>

  <div class="tagline" aria-label="Be Someone" id="tagline"></div>

  <div class="status-label">Stream Starting Soon</div>

  <div class="countdown-wrap">
    <div class="countdown-timer" id="countdownTimer" aria-live="polite">15:00</div>
  </div>

  <div class="cta-row">
    <div class="cta-item">
      <img src="../assets/logo/Whatnot-logo.svg" class="cta-icon" alt="Whatnot"
           style="filter: brightness(0) invert(1);">
      <div class="cta-text">Follow</div>
    </div>
    <div class="cta-divider"></div>
    <div class="cta-item">
      <svg class="cta-icon" viewBox="0 0 24 24" aria-label="TikTok">
        <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>
      </svg>
      <div class="cta-text">Follow</div>
    </div>
    <div class="cta-divider"></div>
    <div class="cta-item">
      <svg class="cta-icon" viewBox="0 0 24 24" aria-label="Instagram">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
      </svg>
      <div class="cta-text">Like & Share</div>
    </div>
  </div>

  <script src="../js/animations.js"></script>
  <script>
    const params       = new URLSearchParams(window.location.search);
    const totalMinutes = parseInt(params.get('countdown') || '15', 10);
    let   remaining    = totalMinutes * 60;

    const timerEl = document.getElementById('countdownTimer');

    const fmt = secs => {
      const m = Math.floor(Math.abs(secs) / 60).toString().padStart(2, '0');
      const s = (Math.abs(secs) % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    };
    const tick = () => {
      timerEl.textContent = fmt(remaining);
      timerEl.classList.toggle('urgent', remaining <= 60 && remaining > 0);
      if (remaining <= 0) {
        timerEl.textContent = 'LIVE NOW!';
        timerEl.classList.add('urgent');
        clearInterval(iv);
      }
      remaining--;
    };
    tick();
    const iv = setInterval(tick, 1000);

    /* Apply brand config */
    const _cfg = window.OVERLAY_CONFIG;
    if (_cfg) {
      const logo = document.getElementById('soonLogo');
      if (logo) { logo.src = _cfg.logoPath; logo.alt = _cfg.brandName; }
      const fallback = document.getElementById('soonLogoFallback');
      if (fallback) fallback.textContent = _cfg.brandShort || _cfg.brandName;
    }

    /* Letter-by-letter slogan reveal — spaces are text nodes so words wrap cleanly */
    const _slogan = (_cfg && _cfg.brandSlogan)
      ? _cfg.brandSlogan.toUpperCase().replace(/'/g, '')
      : 'YOU MISS 100% OF THE RIPS YOU DONT TAKE.';
    const taglineEl = document.getElementById('tagline');
    _slogan.split('').forEach((char, i) => {
      if (char === ' ') {
        taglineEl.appendChild(document.createTextNode(' '));
        return;
      }
      const span = document.createElement('span');
      span.className   = 'tagline-letter';
      span.textContent = char;
      span.animate(
        [{ opacity: 0, transform: 'translateY(30px) scaleY(0.5)' },
         { opacity: 1, transform: 'translateY(0) scaleY(1)' }],
        { duration: 400, delay: 800 + i * 80, fill: 'forwards',
          easing: 'cubic-bezier(0.34,1.56,0.64,1)' }
      );
      taglineEl.appendChild(span);
    });

    NGCAnim.createParticleSystem(document.getElementById('particleLayer'), 45, 'drift');
  </script>
</body>
</html>
